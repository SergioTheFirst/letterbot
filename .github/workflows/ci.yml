name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall mailbot_v26 -q

      - name: Run full test suite
        run: python -m pytest mailbot_v26/tests/ -q --tb=short

      - name: Run golden corpus
        run: python -m mailbot_v26.tools.eval_golden_corpus

      - name: Run cleanup status
        run: python -m mailbot_v26.tools.cleanup --status

      - name: Show version & entrypoint
        run: python -c "import sys; print(sys.version); import mailbot_v26; print('IMPORT_OK')"

      - name: Fail if working tree dirty
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree dirty after tests."
            git status --porcelain
            exit 1
          fi

  build_windows:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    needs: test
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Create build venv
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -r requirements.txt
          .\.venv\Scripts\python -m pip install -r requirements-build.txt

      - name: Build one-folder release
        run: cmd /c build_windows_onefolder.bat

      - name: Verify one-folder release
        run: cmd /c verify_dist.bat

      - name: Package one-folder release
        run: powershell Compress-Archive dist/Letterbot dist/Letterbot.zip

      - name: Installer smoke (build, quiet install, verify installed tree)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $target = Join-Path $env:RUNNER_TEMP "LetterbotInstallSmoke"
          .\.venv\Scripts\python -m mailbot_v26.tools.build_windows_installer dist\Letterbot build\installer-smoke\Letterbot-Setup.exe --work-dir build\installer-smoke --install-dir $target
          if ($LASTEXITCODE -ne 0) { throw "installer smoke build failed" }
          Start-Process -FilePath "build\installer-smoke\Letterbot-Setup.exe" -ArgumentList "/Q" -Wait
          $installLog = Join-Path $env:TEMP "Letterbot-install.log"
          if (Test-Path $installLog) { Get-Content $installLog }
          if (-not (Test-Path (Join-Path $target "Letterbot.exe"))) { throw "installer did not install Letterbot.exe" }
          if (Test-Path (Join-Path $target "mailbot_v26\config\accounts.ini")) { throw "installer shipped accounts.ini" }
          .\.venv\Scripts\python -m mailbot_v26.tools.verify_dist $target
          if ($LASTEXITCODE -ne 0) { throw "installed bundle failed verify_dist" }

      - name: Build installer
        timeout-minutes: 15
        run: .\.venv\Scripts\python -m mailbot_v26.tools.build_windows_installer dist\Letterbot dist\Letterbot-Setup.exe

      - name: Upload one-folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: Letterbot-windows-onefolder
          path: dist/Letterbot.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Letterbot-windows-installer
          path: dist/Letterbot-Setup.exe
          if-no-files-found: error
          retention-days: 7
