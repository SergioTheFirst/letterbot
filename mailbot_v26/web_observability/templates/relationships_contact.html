{% extends "base.html" %}
{% block title %}Contact · LetterBot.ru{% endblock %}

{% block content %}
  {% if error_block %}
  <div class="alert">{{ error_block | striptags }}</div>
  {% endif %}

  <div class="card-actions">
    <a class="btn ghost" href="{{ relationships_url }}">&larr; Relationships</a>
  </div>

  <div class="card" id="contact-data"
       data-contact='{{ detail | tojson }}'
       data-contact-id='{{ contact_id | e }}'>
    <div class="section-title">
      <h2>Contact detail</h2>
      <div class="hint">{{ contact_id }}</div>
    </div>
    <div id="contact-content">
      <div class="hint">Loading...</div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='relationships.js') }}" nonce="{{ csp_nonce }}" defer></script>
{% endblock %}
