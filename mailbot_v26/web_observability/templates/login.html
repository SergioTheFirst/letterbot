<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title or "Sign in" }} - LetterBot.ru</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page login-page">
    <section class="card login-card">
      <h1>LetterBot.ru</h1>
      {% if auth_configured %}
      <p class="hint">Remote access: sign in with the web password or API token.</p>
      {% if error_message %}<p class="alert" role="alert">{{ error_message }}</p>{% endif %}
      <form method="post" action="{{ url_for('login') }}" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_target }}">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Sign in</button>
      </form>
      {% else %}
      <p class="alert" role="alert">{{ disabled_text }}</p>
      {% endif %}
    </section>
  </main>
</body>
</html>
