{% extends "base.html" %}
{% block title %}Page not found · LetterBot.ru{% endblock %}
{% block scope_form %}{% endblock %}
{% block content %}

    <p>This page does not exist. The link may be mistyped, or the page has moved.</p>
    <ul class="simple-links">
      <li><a href="{{ url_for('index') }}">Go to Home</a></li>

    </ul>
  </section>
{% endblock %}
